name: Dependency audit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: read
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Capture resolved dependency graph
        run: gradle --no-daemon :app:dependencies --configuration debugRuntimeClasspath > dependency-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: dependency-report.txt
