name: Dependency audit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: read
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Android SDK for compilation
        run: |
          set -euo pipefail
          sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-37" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.0'
      - name: Capture resolved dependency graph
        run: gradle --no-daemon :app:dependencies --configuration debugRuntimeClasspath > dependency-report.txt
      - name: Export resolved Maven coordinates
        run: gradle --no-daemon -I scripts/dependency-inventory.gradle :app:exportResolvedDependencies
      - name: Check OSV advisories
        run: python3 scripts/scan_dependencies.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-report
          path: |
            dependency-report.txt
            resolved-dependencies.txt
            vulnerability-report.json
