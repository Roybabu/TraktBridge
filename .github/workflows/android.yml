name: Android CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK packages
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --version
          "$sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Build and verify stable debug APK
        id: stable_debug
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DEBUG_KEY_BASE64: ${{ secrets.TRAKT_DEBUG_KEYSTORE_BASE64 }}
          TRAKT_DEBUG_PASSWORD: ${{ secrets.TRAKT_DEBUG_PASSWORD }}
          EXPECTED_SHA256: '6a973921ec132f1a6ebfee39e7f8567a4eaa0f1d3a51fda9a246dc86c8c518af'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DEBUG_KEY_BASE64" || -z "$TRAKT_DEBUG_PASSWORD" ]]; then
            echo "::error::Permanent debug signing credentials are missing. Refusing to publish an incompatible update APK."
            exit 1
          fi
          umask 077
          export TRAKT_DEBUG_KEYSTORE_PATH="$RUNNER_TEMP/traktbridge-debug.jks"
          trap 'rm -f "$TRAKT_DEBUG_KEYSTORE_PATH"' EXIT
          printf '%s' "$DEBUG_KEY_BASE64" | base64 --decode > "$TRAKT_DEBUG_KEYSTORE_PATH"
          unset DEBUG_KEY_BASE64
          gradle --no-daemon :app:assembleDebug --rerun-tasks
          apk=app/build/outputs/apk/debug/app-debug.apk
          report=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk")
          actual=$(printf '%s\n' "$report" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          expected=$(printf '%s' "$EXPECTED_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          [[ "$actual" == "$expected" ]] || { echo "::error::Debug signing certificate mismatch"; exit 1; }
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
      - uses: actions/upload-artifact@v4
        if: steps.stable_debug.outputs.ready == 'true'
        with:
          name: TraktBridge-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
