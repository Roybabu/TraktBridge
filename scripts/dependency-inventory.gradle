import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.result.UnresolvedDependencyResult

gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.tasks.register('exportResolvedDependencies') {
        doLast {
            def coordinates = new TreeSet<String>()
            ['debugRuntimeClasspath', 'releaseRuntimeClasspath'].each { name ->
                def graph = app.configurations.getByName(name).incoming.resolutionResult
                if (graph.allDependencies.any { it instanceof UnresolvedDependencyResult }) {
                    throw new GradleException("Dependency resolution incomplete: " + name)
                }
                graph.allComponents.each { component ->
                    if (component.id instanceof ModuleComponentIdentifier) {
                        def id = component.id
                        coordinates.add(id.group + ':' + id.module + ':' + id.version)
                    }
                }
            }
            if (coordinates.isEmpty()) throw new GradleException('Empty dependency inventory')
            new File(gradle.rootProject.projectDir, 'resolved-dependencies.txt').text = coordinates.join('\n') + '\n'
        }
    }
}
